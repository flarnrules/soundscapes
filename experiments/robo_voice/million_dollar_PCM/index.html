<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🧠 Robot Voice Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🤖 Robot Voice Engine</h1>

  <textarea id="text" rows="4">I am a synthetic voice being with zero mercy.</textarea>

  <div class="controls">
    <label>Voice:
      <select id="voiceSelect"></select>
    </label>

    <label>Layers:
      <input type="range" id="layers" min="1" max="5" value="3" />
      <span id="layersVal">3</span>
    </label>

    <label>Delay (ms):
      <input type="range" id="delay" min="0" max="300" step="10" value="80" />
      <span id="delayVal">80</span>
    </label>

    <label>Detune (cents):
      <input type="range" id="detune" min="0" max="100" step="1" value="25" />
      <span id="detuneVal">25</span>
    </label>

    <label>Stereo Spread:
      <input type="range" id="spread" min="0" max="1" step="0.1" value="0.6" />
      <span id="spreadVal">0.6</span>
    </label>
  </div>

  <button id="speak">🗣️ Speak</button>

  <script src="script.js"></script>
</body>
</html>
