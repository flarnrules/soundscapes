<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Synth + Visualizer + Multi-Track Sequencer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>🎛️ Synth + Visualizer</header>

  <main class="app">
    <!-- Left sidebar: synth + transport -->
    <section class="controls">
      <div class="panel">
        <div class="row">
          <button id="startBtn">Start Audio</button>
          <button id="stopAllBtn">Stop All Notes</button>
        </div>
        <small>
          Keys: A/W/S/E/D/F/T/G/Y/H/U/J/K • Sustain: Space • Octave: Z / X (<b id="octaveDisp">0</b>)
        </small>
      </div>

      <div class="panel">
        <h3>Transport</h3>
        <div class="row">
          <button id="transportBtn">Play</button>
          <label>BPM <input id="bpm" type="number" min="40" max="240" step="1" value="120" style="width:80px"></label>
          <label>Swing % <input id="swing" type="range" min="0" max="65" step="1" value="0"></label>
          <button id="clearSeq">Clear</button>
        </div>
      </div>

      <div class="panel">
        <h3>Oscillator</h3>
        <div id="waveRadios" class="wave-radios" role="radiogroup" aria-label="Waveform">
          <label class="wave-card">
            <svg viewBox="0 0 100 40" aria-hidden="true"><path d="M0 20 Q25 0 50 20 T100 20" fill="none" stroke="currentColor" stroke-width="3"/></svg>
            <input type="radio" name="wave" value="sine">
          </label>
          <label class="wave-card">
            <svg viewBox="0 0 100 40" aria-hidden="true"><path d="M0 20 H25 V5 H75 V35 H100" fill="none" stroke="currentColor" stroke-width="3"/></svg>
            <input type="radio" name="wave" value="square" checked>
          </label>
          <label class="wave-card">
            <svg viewBox="0 0 100 40" aria-hidden="true"><path d="M0 35 L25 5 L25 35 L50 5 L50 35 L75 5 L75 35 L100 5" fill="none" stroke="currentColor" stroke-width="3"/></svg>
            <input type="radio" name="wave" value="sawtooth">
          </label>
          <label class="wave-card">
            <svg viewBox="0 0 100 40" aria-hidden="true"><path d="M0 35 L25 5 L50 35 L75 5 L100 35" fill="none" stroke="currentColor" stroke-width="3"/></svg>
            <input type="radio" name="wave" value="triangle">
          </label>
        </div>
      </div>

      <div class="panel">
        <h3>Envelope (ADSR)</h3>
        <label>Attack  <input id="attack" type="range" min="0" max="2" step="0.01" value="0.02"></label>
        <label>Decay   <input id="decay"  type="range" min="0" max="2" step="0.01" value="0.15"></label>
        <label>Sustain <input id="sustain"type="range" min="0" max="1" step="0.01" value="0.6"></label>
        <label>Release <input id="release"type="range" min="0" max="3" step="0.01" value="0.4"></label>
      </div>

      <div class="panel">
        <h3>Filter</h3>
        <label>Cutoff (Hz) <input id="cutoff" type="range" min="100" max="8000" step="1" value="1200"></label>
        <label>Q           <input id="q"      type="range" min="0.0001" max="20" step="0.0001" value="0.7"></label>
        <label>Type
          <select id="filterType">
            <option value="lowpass" selected>lowpass</option>
            <option value="highpass">highpass</option>
            <option value="bandpass">bandpass</option>
          </select>
        </label>
      </div>

      <div class="panel">
        <h3>LFO → Filter</h3>
        <label>Rate (Hz)  <input id="lfoRate"  type="range" min="0" max="20" step="0.01" value="4"></label>
        <label>Depth (Hz) <input id="lfoDepth" type="range" min="0" max="2000" step="1" value="500"></label>
      </div>

      <div class="panel">
        <h3>Delay</h3>
        <label>Time (s)   <input id="delayTime"     type="range" min="0" max="1.2" step="0.01" value="0.25"></label>
        <label>Feedback   <input id="delayFeedback" type="range" min="0" max="0.95" step="0.01" value="0.35"></label>
        <label>Mix        <input id="delayMix"      type="range" min="0" max="1" step="0.01" value="0.3"></label>
      </div>

      <div class="panel">
        <h3>Section Volume</h3>
        <label>Lead  <input id="leadVol" type="range" min="0" max="1" step="0.01" value="0.9"></label>
        <label>Bass  <input id="bassVol" type="range" min="0" max="1" step="0.01" value="0.9"></label>
        <label>Drum  <input id="drumVol" type="range" min="0" max="1" step="0.01" value="0.9"></label>
      </div>

      <div class="panel">
        <h3>Image Reactive</h3>
        <label><input type="checkbox" id="imageReactive" checked> Enable</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>
    </section>

    <!-- Right: display screen area -->
    <section class="display">
      <!-- Top row: LEFT = osc+bars (stack), RIGHT = image -->
      <div class="topRow">
        <div class="stack">
          <canvas id="wave"></canvas>
          <canvas id="bars"></canvas>
        </div>
        <canvas id="img"></canvas>
      </div>

      <!-- Bottom: big sequencer spanning full width -->
      <canvas id="seq"
        title="Sequencer: Lead (8r x 16c) • Bass (8r x 32c, -2 oct) • Drums (4r x 16c). Left gutter = per-row velocity knobs.">
      </canvas>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
