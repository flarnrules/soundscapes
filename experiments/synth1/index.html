<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Synth + Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>🎛️ Synth + Visualizer</header>

  <main class="app">
    <!-- Left sidebar: synth controls -->
    <section class="controls">
      <div class="row">
        <button id="startBtn">Start Audio</button>
        <button id="stopAllBtn">Stop All Notes</button>
      </div>

      <div class="panel">
        <h3>Oscillator</h3>
        <label>
          Waveform
          <select id="waveSelect">
            <option value="sine">sine</option>
            <option value="square" selected>square</option>
            <option value="sawtooth">sawtooth</option>
            <option value="triangle">triangle</option>
          </select>
        </label>
      </div>

      <div class="panel">
        <h3>Envelope (ADSR)</h3>
        <label>Attack  <input id="attack" type="range" min="0" max="2" step="0.01" value="0.02"></label>
        <label>Decay   <input id="decay"  type="range" min="0" max="2" step="0.01" value="0.15"></label>
        <label>Sustain <input id="sustain"type="range" min="0" max="1" step="0.01" value="0.6"></label>
        <label>Release <input id="release"type="range" min="0" max="3" step="0.01" value="0.4"></label>
      </div>

      <div class="panel">
        <h3>Filter</h3>
        <label>Cutoff (Hz) <input id="cutoff" type="range" min="100" max="8000" step="1" value="1200"></label>
        <label>Q           <input id="q"      type="range" min="0.0001" max="20" step="0.0001" value="0.7"></label>
        <label>Type
          <select id="filterType">
            <option value="lowpass" selected>lowpass</option>
            <option value="highpass">highpass</option>
            <option value="bandpass">bandpass</option>
          </select>
        </label>
      </div>

      <div class="panel">
        <h3>LFO → Filter</h3>
        <label>Rate (Hz)  <input id="lfoRate"  type="range" min="0" max="20" step="0.01" value="4"></label>
        <label>Depth (Hz) <input id="lfoDepth" type="range" min="0" max="2000" step="1" value="500"></label>
      </div>

      <div class="panel">
        <h3>Delay</h3>
        <label>Time (s)   <input id="delayTime"     type="range" min="0" max="1.2" step="0.01" value="0.25"></label>
        <label>Feedback   <input id="delayFeedback" type="range" min="0" max="0.95" step="0.01" value="0.35"></label>
        <label>Mix        <input id="delayMix"      type="range" min="0" max="1" step="0.01" value="0.3"></label>
      </div>

      <div class="panel">
        <h3>Test Notes</h3>
        <div class="row">
          <button class="noteBtn" data-note="C4">C</button>
          <button class="noteBtn" data-note="E4">E</button>
          <button class="noteBtn" data-note="G4">G</button>
        </div>
        <small>Keyboard: A/W/S/E/D/F/T/G/Y/H/U/J/K (C4 → C5). Hold keys for sustain.</small>
      </div>

      <div class="panel">
        <h3>Image Reactive</h3>
        <label>
          <input type="checkbox" id="imageReactive" checked>
          Enable
        </label>
        <input type="file" id="imageInput" accept="image/*">
        <small>Image appears top-right; waveform drives displacement.</small>
      </div>
    </section>

    <!-- Right: display screen area -->
    <section class="display">
      <div class="topRow">
        <canvas id="seq"></canvas>
        <canvas id="img"></canvas>
      </div>
      <canvas id="wave"></canvas>
      <canvas id="bars"></canvas>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
